{{- if .Values.grafana.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "devicedatahub.fullname" . }}-grafana-datasource
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/instance: {{ .Release.Name }}
data:
  timescaledb.yml: |
    apiVersion: 1
    datasources:
      - name: TimescaleDB
        uid: timescaledb
        type: postgres
        access: proxy
        url: timescaledb:5432
        database: {{ .Values.postgres.database }}
        user: {{ .Values.postgres.user }}
        editable: true
        secureJsonData:
          password: {{ .Values.postgres.password }}
        jsonData:
          database: {{ .Values.postgres.database }}
          sslmode: disable
          postgresVersion: 1600
          timescaledb: true
{{- if .Values.grafana.dashboard.enabled }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "devicedatahub.fullname" . }}-grafana-dashboard-provider
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/instance: {{ .Release.Name }}
data:
  default.yaml: |
    apiVersion: 1
    providers:
      - name: DeviceDataHub
        orgId: 1
        folder: DeviceDataHub
        type: file
        disableDeletion: true
        editable: true
        options:
          path: /var/lib/grafana/dashboards
{{- end }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "devicedatahub.fullname" . }}-grafana
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.grafana.storage.size }}
  {{- with .Values.grafana.storage.storageClassName }}
  storageClassName: {{ . | quote }}
  {{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "devicedatahub.fullname" . }}-grafana
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: grafana
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: grafana
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      containers:
        - name: grafana
          image: {{ .Values.grafana.image | quote }}
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: GF_SECURITY_ADMIN_USER
              value: {{ .Values.grafana.adminUser | quote }}
            - name: GF_SECURITY_ADMIN_PASSWORD
              value: {{ .Values.grafana.adminPassword | quote }}
            - name: GF_USERS_ALLOW_SIGN_UP
              value: "false"
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          volumeMounts:
            - name: data
              mountPath: /var/lib/grafana
            - name: datasource
              mountPath: /etc/grafana/provisioning/datasources/timescaledb.yml
              subPath: timescaledb.yml
            {{- if .Values.grafana.dashboard.enabled }}
            - name: dashboard-provider
              mountPath: /etc/grafana/provisioning/dashboards/default.yaml
              subPath: default.yaml
            - name: dashboard
              mountPath: /var/lib/grafana/dashboards/{{ .Values.grafana.dashboard.fileName }}
              subPath: {{ .Values.grafana.dashboard.fileName }}
            {{- end }}
          resources:
            {{- toYaml .Values.grafana.resources | nindent 12 }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "devicedatahub.fullname" . }}-grafana
        - name: datasource
          configMap:
            name: {{ include "devicedatahub.fullname" . }}-grafana-datasource
        {{- if .Values.grafana.dashboard.enabled }}
        - name: dashboard-provider
          configMap:
            name: {{ include "devicedatahub.fullname" . }}-grafana-dashboard-provider
        - name: dashboard
          configMap:
            name: {{ .Values.grafana.dashboard.configMapName }}
        {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      port: {{ .Values.grafana.service.port }}
      targetPort: http
{{- end }}
